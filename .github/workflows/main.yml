
name: OBSPLus - Build and Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build project
        run: npm run build

      - name: Package output
        run: |
          cd dist
          zip -r ../OBSPLus-ready.zip .

      - name: Upload ready package
        uses: actions/upload-artifact@v4
        with:
          name: OBSPLus-ready
          path: OBSPLus-ready.zip
          retention-days: 30
